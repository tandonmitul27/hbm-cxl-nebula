# =====================================================================
#  HBM3, ONE channel -- the per-channel building block
#  @tandonmitul27  --  AUTHORED FILE (DRAMsim3 ships no HBM3 config)
# =====================================================================
#
#  WHY THIS FILE EXISTS
#      DRAMsim3's bundled configs stop at HBM2.  Every HBM3 number in
#      this project comes from this file, so its provenance is the
#      provenance of the whole near-memory tier.
#
#  GEOMETRY -- JESD238A (the JEDEC HBM3 standard)
#      16 channels x 64 bit, 2 pseudo-channels each, 8 bank groups x
#      4 banks, BL8, 1 KB page.  Table 4 (densities/addressing) and
#      Table 92 (speed bins) fix all of it.
#      columns = 64 (not 32): DRAMsim3 internally doubles the column
#      count for HBM's prefetch, and 32 trips a capacity assertion.
#
#  TIMING -- Ramulator2's JESD238-cited HBM3 preset, converted to
#      cycles at tCK below.  JESD238A deliberately does NOT fix array
#      timing VALUES ("tRAS is the analog value from the vendor
#      datasheet"), so a vendor-representative preset is the strongest
#      available source short of an NDA datasheet.
#      tFAW / tRRD are HALVED relative to their channel-level values:
#      JESD238A Table 3 / s3.1.2 scopes array timings PER PSEUDO-CHANNEL,
#      and we model at channel level.
#
#  CLOCK DOMAIN
#      tCK here is the DATA-STROBE domain, not JEDEC's command clock.
#      Cycle counts therefore differ from the standard's tables while
#      every nanosecond value matches.
#
#  QUEUES -- measured, not guessed.  trans_queue_size = 128 is the knee
#      of a sweep; the stock 32 leaves the device latency-bound at a
#      fraction of peak.  See docs/CALIBRATION.md.
#
#  ADDRESS MAPPING -- rorabgbacoch, also measured.  The stock
#      rorabgbachco maps sequential traffic onto one bank group and
#      costs ~40% of achievable bandwidth.
#
#  WHY A SEPARATE SINGLE-CHANNEL FILE
#      gem5's DRAMsim3 wrapper caps TOTAL outstanding requests at
#      the scalar trans_queue_size, so one 16-channel instance is
#      request-limited long before the device is.  A full stack is
#      therefore built as 16 INDEPENDENT controller instances
#      (smoke_hbm.py --pairs 16), each carrying its own queue.
#      This file is that building block; it is also what the
#      latency and energy harnesses drive.
#
# =====================================================================

[dram_structure]
protocol = HBM
bankgroups = 8
banks_per_group = 4
rows = 32768
columns = 64
device_width = 64
BL = 8
num_dies = 8

[timing]
tCK = 0.3125
CL = 40
CWL = 20
tRCDRD = 62
tRCDWR = 30
tRP = 52
tRAS = 90
tRFC = 1120
tREFI = 12480
tREFIb = 390
tRPRE = 2
tWPRE = 2
tRRD_S = 4
tRRD_L = 5
tWTR_S = 14
tWTR_L = 20
tFAW = 24
tWR = 66
tCCD_S = 4
tCCD_L = 8
tXS = 1152
tCKE = 26
tCKSRE = 32
tXP = 26
tRTP_L = 18
tRTP_S = 18

[power]
# Calibrated-to-published, one scale factor: JESD238A fixes VDD (Table 70)
# and the IDD state definitions (s9) but leaves current VALUES to vendor
# datasheets (Table 90 is an empty template).  These currents are the HBM2
# template's state RATIOS scaled by a single factor k=3.270 so that the
# measured total at the validated sequential operating point equals the
# published HBM access energy, 3.97 pJ/bit (O'Connor et al., MICRO'17).
# NOTE DRAMsim3 energy stats are V*mA*cycles -- multiply by tCK for pJ
# (see sim/measure_energy.py).
VDD = 1.1
IDD0 = 213
IDD2P = 92
IDD2N = 131
IDD3P = 131
IDD3N = 180
IDD4W = 1635
IDD4R = 1275
IDD5AB = 818
IDD6x = 101
[system]
channel_size = 1024
channels = 1
bus_width = 64
address_mapping = rorabgbacoch
queue_structure = PER_BANK
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 128
unified_queue = False

[other]
epoch_period = 1000000
output_level = 1
