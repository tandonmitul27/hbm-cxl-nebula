# =====================================================================
#  DDR5-6400, one 32-bit subchannel -- the CXL expander's media
#  @tandonmitul27  --  AUTHORED FILE (DRAMsim3 ships no DDR5 config)
# =====================================================================
#
# WHY THIS FILE EXISTS
#     The far tier needs a real medium behind the CXL protocol path.
#     DRAMsim3 stops at DDR4, so without this file the expander would be
#     modelled with DDR4 timings and DDR4 energy -- wrong on both counts
#     for any device built in the last several years.
#
# WHY DDR5-6400, AND WHY EIGHT OF THEM
#     Sized to a shipping part rather than chosen.  Marvell Structera X
#     2504 is a CXL 2.0 x16 expander with 4 channels of DDR5-6400 and a
#     quoted 200 GB/s.  One 64-bit DDR5 channel = two 32-bit subchannels,
#     so 4 channels = 8 instances of this file = 204.8 GB/s.  Astera Labs
#     Leo (2ch DDR5-5600 per x16) sits in the same place.  Both provision
#     backend bandwidth ABOVE the x16 link -- which is what makes "the
#     link binds" an observation about real devices rather than an
#     assumption of ours.
#
# ENERGY PROVENANCE -- note this one is UNCALIBRATED
#     Unlike the HBM configs, nothing here was tuned to hit a target.
#     That it lands at ~11.8 pJ/bit, inside the DDR/GDDR device-class
#     range, is therefore a CHECK rather than a fitted result.
# =====================================================================
#
# DDR5-6400, one 32-bit subchannel (4x 4Gb-x8 devices) -- the CXL expander
# backend medium.  Matches the production expander briefs: Marvell Structera
# X 2504 (4ch DDR5-6400) and Astera Leo (2ch DDR5-5600); one full 64-bit DDR5
# channel = two of these subchannels.
#
# Source: authored from gem5 25.1 src/mem/DRAMInterface.py DDR5_6400_4x8,
# whose timings come from the Micron DDR5 SDRAM core datasheet (p.389 speed
# bins) and whose IDD currents come from the Micron 16Gb DDR5 die rev A
# datasheet at the DDR5-4800 grade (the fastest grade with published IDD;
# used unchanged at 6400 MT/s, same as gem5's own DDR5_6400 class).
#
# DRAMsim3 has no DDR5 protocol enum; DDR5 is expressed as protocol=DDR4
# (which provides bank groups + same-bank refresh semantics) with DDR5
# geometry, BL16, and DDR5 timings.  Cycle values are ns figures from the
# gem5 class divided by tCK=0.3125 ns, rounded UP (JEDEC convention):
#   CL/tRCD/tRP 14.375ns -> 46   tRAS 32ns -> 103   tRFC(1) 295ns -> 944
#   tWR 30ns -> 96   tRTP 7.5ns -> 24   tREFI 3.9us -> 12480
#   tRRD_S 8nCK      tRRD_L 5ns -> 16   tFAW max(32nCK,10ns) -> 32
#   tCCD_S 8nCK      tCCD_L 5ns -> 16   tWTR_S 2.5ns -> 8  tWTR_L 10ns -> 32
# VPP current (IPP) is not carried by the gem5 class; IPP0=0 understates
# total energy by the small VPP term, stated in sim/README.md.

[dram_structure]
protocol = DDR4
bankgroups = 8
banks_per_group = 4
rows = 65536
columns = 256
device_width = 8
BL = 16

[timing]
tCK = 0.3125
AL = 0
CL = 46
CWL = 44
tRCD = 46
tRP = 46
tRAS = 103
tRFC = 944
tRFC2 = 944
tRFC4 = 944
tREFI = 12480
tRPRE = 1
tWPRE = 1
tRRD_S = 8
tRRD_L = 16
tWTR_S = 8
tWTR_L = 32
tFAW = 32
tWR = 96
tWR2 = 97
tRTP = 24
tCCD_S = 8
tCCD_L = 16
tCKE = 24
tCKESR = 25
tXS = 944
tXP = 24
tRTRS = 1

[power]
VDD = 1.1
IDD0 = 122
IPP0 = 0
IDD2P = 88
IDD2N = 92
IDD3P = 140
IDD3N = 142
IDD4W = 479
IDD4R = 530
IDD5AB = 277
IDD6x = 102

[system]
channel_size = 2048
channels = 1
bus_width = 32
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 128

[other]
epoch_period = 3200000
output_level = 1
