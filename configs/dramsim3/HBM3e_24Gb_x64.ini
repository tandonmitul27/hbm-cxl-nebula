# =====================================================================
#  HBM3E, one full stack: 16 channels x 64 bit, 24 GB
#  @tandonmitul27  --  AUTHORED FILE (DRAMsim3 ships no HBM3E config)
# =====================================================================
#
#  WHY THIS FILE EXISTS
#      DRAMsim3's bundled configs stop at HBM2.  Every HBM3E number in
#      this project comes from this file, so its provenance is the
#      provenance of the whole near-memory tier.
#
#  GEOMETRY -- JESD238A (the JEDEC HBM3E standard)
#      16 channels x 64 bit, 2 pseudo-channels each, 8 bank groups x
#      4 banks, BL8, 1 KB page.  Table 4 (densities/addressing) and
#      Table 92 (speed bins) fix all of it.
#      columns = 64 (not 32): DRAMsim3 internally doubles the column
#      count for HBM's prefetch, and 32 trips a capacity assertion.
#
#  TIMING -- Ramulator2's JESD238-cited HBM3E preset, converted to
#      cycles at tCK below.  JESD238A deliberately does NOT fix array
#      timing VALUES ("tRAS is the analog value from the vendor
#      datasheet"), so a vendor-representative preset is the strongest
#      available source short of an NDA datasheet.
#      tFAW / tRRD are HALVED relative to their channel-level values:
#      JESD238A Table 3 / s3.1.2 scopes array timings PER PSEUDO-CHANNEL,
#      and we model at channel level.
#
#  CLOCK DOMAIN
#      tCK here is the DATA-STROBE domain, not JEDEC's command clock.
#      Cycle counts therefore differ from the standard's tables while
#      every nanosecond value matches.
#
#  QUEUES -- measured, not guessed.  trans_queue_size = 128 is the knee
#      of a sweep; the stock 32 leaves the device latency-bound at a
#      fraction of peak.  See docs/CALIBRATION.md.
#
#  ADDRESS MAPPING -- rorabgbacoch, also measured.  The stock
#      rorabgbachco maps sequential traffic onto one bank group and
#      costs ~40% of achievable bandwidth.
#
#  HBM3E CAVEAT -- array timings are HELD FROM HBM3 in nanoseconds
#      with only the PHY rate scaled (9.6 Gbps/pin) and tRFC moved
#      to the 450 ns density tier.  Ramulator2 has no HBM3E preset
#      and JESD238A covers HBM3, so this is a declared ESTIMATE:
#      same array generation, defensible, but not sourced.
#      Measured 1027.3 GB/s/stack (84% of the 1228.8 peak).
#
# =====================================================================

[dram_structure]
protocol = HBM
bankgroups = 8
banks_per_group = 4
rows = 49152
columns = 64
device_width = 64
BL = 8
num_dies = 8

[timing]
tCK = 0.2083
CL = 60
CWL = 30
tRCDRD = 93
tRCDWR = 45
tRP = 78
tRAS = 135
tRFC = 2160
tREFI = 18723
tREFIb = 585
tRPRE = 2
tWPRE = 2
tRRD_S = 6
tRRD_L = 7
tWTR_S = 21
tWTR_L = 30
tFAW = 36
tWR = 99
tCCD_S = 4
tCCD_L = 8
tXS = 2208
tCKE = 38
tCKSRE = 48
tXP = 38
tRTP_L = 27
tRTP_S = 27

[power]
# Calibrated-to-published (see HBM3 config for method): HBM2 template state
# RATIOS scaled by k=4.648 so measured total at the validated sequential
# point equals 3.97 pJ/bit (O'Connor MICRO'17).  Held EQUAL to HBM3 per bit:
# no vendor publishes HBM3E pJ/bit; Micron's brief claims 2.5x perf/W vs
# HBM2E, so equal-energy is the conservative choice.
VDD = 1.1
IDD0 = 302
IDD2P = 130
IDD2N = 186
IDD3P = 186
IDD3N = 256
IDD4W = 2324
IDD4R = 1813
IDD5AB = 1162
IDD6x = 144
[system]
channel_size = 1536
channels = 16
bus_width = 64
address_mapping = rorabgbacoch
queue_structure = PER_BANK
row_buf_policy = OPEN_PAGE
cmd_queue_size = 8
trans_queue_size = 128
unified_queue = False

[other]
epoch_period = 1000000
output_level = 1
